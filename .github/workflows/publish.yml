name: CI & Publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────
  # Job 1: Test on every push / PR
  # ─────────────────────────────────────────
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

  # ─────────────────────────────────────────
  # Job 2: Publish to npm only on main push
  #        and only when version changed
  # ─────────────────────────────────────────
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write  # needed for creating git tags

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # need previous commit to diff version

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Check if version changed
        id: version_check
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

          # Check if this version already exists on npm
          if npm view i18n-hunter@$CURRENT version 2>/dev/null | grep -q "$CURRENT"; then
            echo "publish=false" >> $GITHUB_OUTPUT
            echo "⏭️  Version $CURRENT already exists on npm — skipping publish."
          else
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "🚀 New version $CURRENT detected — will publish!"
          fi

      - name: Build
        if: steps.version_check.outputs.publish == 'true'
        run: npm run build

      - name: Publish to npm
        if: steps.version_check.outputs.publish == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Git tag
        if: steps.version_check.outputs.publish == 'true'
        run: |
          VERSION=${{ steps.version_check.outputs.current }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: steps.version_check.outputs.publish == 'true'
        run: |
          echo "### ✅ Published i18n-hunter@${{ steps.version_check.outputs.current }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 [View on npm](https://www.npmjs.com/package/i18n-hunter/v/${{ steps.version_check.outputs.current }})" >> $GITHUB_STEP_SUMMARY
